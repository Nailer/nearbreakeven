[package]
name = "breakeven-ledger"
version = "0.1.0"
edition = "2021"
description = "NEAR Breakeven ledger: anchors each thesis run (snapshot hash, results hash, verdict) and records who re-ran it and whether their numbers matched."
license = "MIT"
repository = "https://github.com/Nailer/nearbreakeven"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.0"

[dev-dependencies]
near-sdk = { version = "=5.29.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
